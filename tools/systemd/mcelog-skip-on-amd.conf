# ENVY BLACK VEIL: mcelog doesn't support current AMD processors. There it exits
# with an error, pointing to the kernel's EDAC driver (which handles machine-check
# errors on those processors anyway), and leaves a failed service behind. So it
# isn't started on AMD processors at all; Intel ones keep it.
# Installed as /usr/lib/systemd/system/mcelog.service.d/50-envy-skip-on-amd.conf.
[Service]
ExecCondition=/bin/sh -c '! grep -q AuthenticAMD /proc/cpuinfo'
