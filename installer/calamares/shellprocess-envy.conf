# Runs inside the freshly installed system, late in the sequence.
---
dontChroot: false
timeout: 120
script:
    # The installed system must not auto-login the way the live session does.
    - "rm -f /etc/sddm.conf.d/20-autologin.conf"
    - "systemctl enable sddm.service"
    # Make sure the ENVY tool runtime is ready for `envy-tools install`.
    - "python3 -m ensurepip --upgrade || true"
