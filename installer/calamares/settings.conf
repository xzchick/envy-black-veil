# ENVY BLACK VEIL — Calamares installer configuration.
# Installs the running live system to disk, including to an external USB/SSD/HDD.
---
modules-search: [ local ]

instances:
- id:       envy
  module:   shellprocess
  config:   shellprocess-envy.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@envy
  - grubcfg
  - bootloader
  - services-systemd
  - initramfs
  - umount
- show:
  - finished

branding: envy

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
