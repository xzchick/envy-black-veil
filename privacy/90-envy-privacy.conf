# ENVY BLACK VEIL: no connectivity check. Otherwise NetworkManager fetches a test
# page from a vendor's server every few minutes to see whether you're online (and
# behind a captive portal). To turn it back on, give it a test page you trust:
#   [connectivity]
#   enabled=true
#   uri=http://example.com/your-test-page.txt
#   response=OK
# then run: sudo systemctl reload NetworkManager
[connectivity]
enabled=false
