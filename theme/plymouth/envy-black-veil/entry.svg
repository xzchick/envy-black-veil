<svg xmlns="http://www.w3.org/2000/svg" width="440" height="52" viewBox="0 0 440 52">
  <!-- The passphrase box: a dark glass field with a cyan edge, as on the ENVY login screen. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35e8ff"/>
      <stop offset="100%" stop-color="#ac8cff"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="437" height="49" rx="10" ry="10" fill="#0a0e22" fill-opacity="0.92"
        stroke="url(#edge)" stroke-width="2"/>
</svg>
