name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils libxml2-utils python3-yaml rpm librsvg2-bin grub-common fonts-dejavu-core
          sudo pip install --break-system-packages pykickstart

      - name: Validate the kickstart
        run: ksvalidator kickstart/envy-black-veil.ks

      - name: ShellCheck the scripts
        run: shellcheck -e SC2059 tools/envy-tools build/build-iso.sh ci/build-in-vm.sh try-black-veil.sh

      - name: Check the boot-test script compiles
        run: python3 -m py_compile ci/boot-test.py

      - name: Check SVG art is well-formed
        run: |
          xmllint --noout \
            theme/wallpaper/envy-black-veil.svg \
            theme/grub/envy-black-veil/background.svg \
            theme/plymouth/envy-black-veil/logo.svg \
            theme/plymouth/envy-black-veil/spark.svg

      - name: Validate JSON config
        run: |
          python3 -c "import json; json.load(open('theme/wallpaper/metadata.json'))"
          python3 -c "import json; p = json.load(open('privacy/firefox-policies.json'))['policies']; assert p['DisableTelemetry'] is True"

      - name: Lint desktop-entry generation
        run: |
          printf '[Desktop Entry]\nType=Application\nName=ENVY Vault\nExec=envy-vault\nTerminal=false\nCategories=Utility;Security;\n' > sample.desktop
          desktop-file-validate sample.desktop
          rm -f sample.desktop

      - name: Build the ENVY identity RPMs (catches spec mistakes in a minute)
        run: |
          mkdir -p .build/SOURCES
          tar --transform "s,^,envy-black-veil-0.1.0/," -czf .build/SOURCES/envy-black-veil-0.1.0.tar.gz theme tools privacy LICENSE
          rpmbuild --nodeps --define "_topdir $PWD/.build" -bb packaging/envy-black-veil.spec
          for f in .build/RPMS/noarch/*.rpm; do echo "== $f"; rpm -qlp "$f"; done

  windows-launcher:
    # GitHub's Windows machines have no Hyper-V, so try-black-veil.ps1 can't start a VM
    # here; it must still parse in Windows PowerShell 5.1 (what Windows ships), pass
    # PSScriptAnalyzer, and stop with its own clear message rather than a stack trace.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse try-black-veil.ps1 in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\try-black-veil.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Write-Host "parses cleanly in PowerShell $($PSVersionTable.PSVersion)"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path .\try-black-veil.ps1 -Severity Warning, Error
          $issues | Format-Table -AutoSize -Wrap
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

      - name: It explains itself when it can't run a VM
        shell: pwsh
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\try-black-veil.ps1 .\no-such.iso 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 1 -or $out -notmatch 'try-black-veil:') {
            Write-Host "expected try-black-veil's own message and exit 1, got exit $rc"
            exit 1
          }
