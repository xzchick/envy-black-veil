name: ISO

# Build the ENVY BLACK VEIL live ISO in a throwaway AlmaLinux 10 VM (the way
# AlmaLinux builds its own live media), then boot it in a VM and check it from
# the inside: UEFI boot path, desktop, SELinux, firewall, nothing listening, and
# the ENVY identity. Screenshots, logs and the ISO are kept as artifacts.

on:
  push:
    branches: [main]
    paths:
      - kickstart/**
      - packaging/**
      - theme/**
      - tools/**
      - build/**
      - ci/**
      - .github/workflows/iso.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: /mnt/envy
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h / "$WORK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU, UEFI firmware and image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf cloud-image-utils xorriso

      - name: Build the ISO in an AlmaLinux 10 VM
        run: VMDIR="$WORK/vm" OUT="$WORK/out" ci/build-in-vm.sh

      - name: Smoke-test the try-it launcher (starts the VM headless for 90 s)
        run: |
          set +e
          TRY_HEADLESS=1 DISK="$WORK/try-disk.qcow2" timeout 90 ./try-black-veil.sh "$(ls "$WORK"/out/envy-black-veil-*.iso)"
          rc=$?
          rm -f "$WORK"/try-disk*
          [ "$rc" -eq 124 ] && echo "launcher started the VM and it kept running" || { echo "launcher exited early ($rc)"; exit 1; }

      - name: Boot the ISO, install it, boot the install, and check both
        run: python3 ci/boot-test.py --install --iso "$(ls "$WORK"/out/envy-black-veil-*.iso)" --out "$WORK/test"

      - name: Keep the boot-test screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            ${{ env.WORK }}/test/*.png
            ${{ env.WORK }}/test/*.log
            ${{ env.WORK }}/test/install-logs.txt
            ${{ env.WORK }}/test/results.json
            ${{ env.WORK }}/test/summary.md
          if-no-files-found: ignore

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.WORK }}/out/*.log
            ${{ env.WORK }}/out/livemedia-logs.tar.gz
            ${{ env.WORK }}/vm/console.log
          if-no-files-found: ignore

      - name: Keep the ISO (14 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: envy-black-veil-iso
          path: |
            ${{ env.WORK }}/out/envy-black-veil-*.iso
            ${{ env.WORK }}/out/envy-black-veil-*.iso.sha256
          retention-days: 14
          compression-level: 0

  iso-aarch64:
    # The same OS for ARM: Apple Silicon Macs (UTM, Parallels, VMware Fusion) and ARM PCs.
    # Built natively on GitHub's ARM runner, in a privileged AlmaLinux 10 container
    # (livemedia-creator --no-virt needs no VM, only loop devices).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      WORK: /mnt/envy
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p "$WORK/out" && sudo chown -R "$(id -u):$(id -g)" "$WORK"
          df -h / "$WORK"

      - name: Check for KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm on this runner: the aarch64 boot test runs emulated (slower, no install test)."
          fi

      - name: Install QEMU and ARM UEFI firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm qemu-utils qemu-efi-aarch64 xorriso

      - name: Build the aarch64 ISO in an AlmaLinux 10 system container
        shell: bash
        run: |
          set -o pipefail
          # AlmaLinux's systemd-enabled image: Anaconda gets systemd, the system bus and
          # udev, as on the VM that builds x86_64.
          sudo docker run -d --name envy-builder --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /dev:/dev \
            -v "$PWD:/src" -v "$WORK/out:/out" almalinux/10-init:10.3
          for _ in $(seq 1 30); do sudo docker exec envy-builder systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break; sleep 2; done
          sudo docker exec envy-builder systemctl is-system-running || true
          sudo docker exec -w /src envy-builder bash -c '
              set -e
              dnf -y -q install epel-release
              dnf -y install lorax lorax-templates-almalinux anaconda rpm-build createrepo_c pykickstart \
                librsvg2-tools grub2-tools-extra dejavu-sans-fonts libblockdev-nvme zstd python3 gzip curl
              OUTDIR=/out ./build/build-iso.sh
            ' 2>&1 | tee "$WORK/build-aarch64.log"
          ls -la "$WORK/out"

      - name: Make the build output readable (even after a failure)
        if: always()
        run: |
          sudo docker rm -f envy-builder >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" "$WORK/out" || true

      - name: Smoke-test the try-it launcher (starts the VM headless for 90 s)
        run: |
          set +e
          TRY_HEADLESS=1 DISK="$WORK/try-disk.qcow2" timeout 90 ./try-black-veil.sh "$(ls "$WORK"/out/envy-black-veil-*.iso)"
          rc=$?
          rm -f "$WORK"/try-disk*
          [ "$rc" -eq 124 ] && echo "launcher started the VM and it kept running" || { echo "launcher exited early ($rc)"; exit 1; }

      - name: Boot the ISO and check it
        run: python3 ci/boot-test.py --arch aarch64 --install --iso "$(ls "$WORK"/out/envy-black-veil-*.iso)" --out "$WORK/test"

      - name: Keep the boot-test screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-aarch64
          path: |
            ${{ env.WORK }}/test/*.png
            ${{ env.WORK }}/test/*.log
            ${{ env.WORK }}/test/install-logs.txt
            ${{ env.WORK }}/test/results.json
            ${{ env.WORK }}/test/summary.md
          if-no-files-found: ignore

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-aarch64
          path: |
            ${{ env.WORK }}/build-aarch64.log
            ${{ env.WORK }}/out/logs/
          if-no-files-found: ignore

      - name: Keep the ISO (14 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: envy-black-veil-iso-aarch64
          path: |
            ${{ env.WORK }}/out/envy-black-veil-*.iso
            ${{ env.WORK }}/out/envy-black-veil-*.iso.sha256
          retention-days: 14
          compression-level: 0
